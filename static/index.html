<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Levi · Мессенджер</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- Auth page -->
<div id="authPage" class="page auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <span>💬</span>
                <h1>Levi</h1>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>
            <div id="loginForm" class="auth-form active">
                <input type="text" id="loginName" placeholder="Имя пользователя">
                <input type="password" id="loginPassword" placeholder="Пароль">
                <button class="auth-btn" id="doLoginBtn">Войти</button>
            </div>
            <div id="registerForm" class="auth-form">
                <input type="text" id="regName" placeholder="Имя пользователя">
                <input type="number" id="regAge" placeholder="Возраст">
                <input type="password" id="regPassword" placeholder="Пароль">
                <button class="auth-btn" id="doRegisterBtn">Зарегистрироваться</button>
            </div>
        </div>
    </div>
</div>

<!-- Chat page -->
<div id="chatPage" class="page chat-page hidden">
    <div class="chat-header">
        <button class="logout-btn" id="logoutBtn">←</button>
        <div class="chat-title">
            <h2>Мессенджер</h2>
            <p>Выберите диалог</p>
        </div>
        <button class="support-btn" id="supportBtn">❓ <span class="support-btn-text">Поддержка</span></button>
        <div class="user-status">
            <div class="online-dot"></div>
            <span id="currentUserName">Пользователь</span>
        </div>
    </div>

    <!-- Модальное окно поддержки -->
    <div class="modal-overlay" id="supportModal">
        <div class="modal">
            <h3>💬 Написать в поддержку</h3>
            <p>Опишите вашу проблему, и мы ответим как можно скорее</p>
            <input type="text" id="supportMessage" placeholder="Ваш вопрос или проблема" maxlength="500">
            <div class="modal-actions">
                <button class="modal-cancel" id="supportCancel">Отмена</button>
                <button class="modal-submit" id="supportSubmit">Отправить</button>
            </div>
        </div>
    </div>

    <div style="display: flex; flex: 1; overflow: hidden;">
        <div class="dialogs-sidebar" id="dialogsSidebar">
            <div class="dialogs-header">
                <h3>Диалоги</h3>
            </div>
            <div class="create-dialog">
                <input type="text" id="companionName" placeholder="Имя собеседника">
                <button id="createDialogBtn">+</button>
            </div>
            <div class="create-dialog" style="margin-top: 8px;">
                <input type="text" id="groupName" placeholder="Название группы">
                <button id="createGroupBtn">+ Группа</button>
            </div>

            <!-- Приглашение в группу (показывается только при выборе группы) -->
            <div id="inviteSection" class="invite-section">
                <input type="text" id="inviteUserName" placeholder="Имя пользователя">
                <button id="inviteUserBtn">Пригласить</button>
            </div>
            <div class="dialogs-list" id="dialogsList">
                <div class="empty-state">Нет диалогов</div>
            </div>
        </div>
        <div class="chat-main" id="chatMain">
            <div class="chat-main-header" id="chatMainHeader" style="display:none; background:#1f1f23; border-bottom:0.5px solid #2c2c2e; padding:10px 14px; align-items:center; gap:10px;">
                <button class="mobile-back-btn" id="mobileBackBtn">←</button>
                <span id="chatMainTitle" style="color:white; font-size:16px; font-weight:600; flex:1;"></span>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">Выберите диалог, чтобы начать общение</div>
            </div>
            <div id="replyPreview" class="reply-preview" style="display:none;">
                <div class="reply-preview-content">
                    <div class="reply-preview-name" id="replyPreviewName"></div>
                    <div class="reply-preview-text" id="replyPreviewText"></div>
                </div>
                <button class="reply-cancel-btn" id="replyCancelBtn">✕</button>
            </div>
            <div class="message-input-area">
                <button id="attachBtn" class="attach-btn">📎</button>
                <input type="text" id="messageInput" placeholder="Сообщение" disabled="">
                <button id="sendMessageBtn" disabled="">→</button>
            </div>
            <div id="previewArea" class="preview-area"></div>
            <input type="file" id="fileInput" multiple="" style="display:none">
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
